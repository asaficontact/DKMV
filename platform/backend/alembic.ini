# Alembic configuration for the DKMV Platform backend.
#
# The initial migration (all nine tables + binding indexes + FK CASCADE) is
# created in slice 0.3-persistence. This scaffold provides a runnable Alembic
# setup so the migration env exists from Phase 0 onward. The sqlalchemy.url is
# overridden at runtime from Settings.DATABASE_URL in alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Default URL; alembic/env.py overrides this from Settings.DATABASE_URL.
sqlalchemy.url = sqlite:///./data/dkmv.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
