[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dkmv-platform-backend"
version = "0.1.0"
description = "DKMV Platform — self-hostable FastAPI control plane wrapping the DKMV engine"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # The locked DKMV engine, consumed in-process via dkmv.runtime.EmbeddedRuntime.
    # Editable-installed from the sibling repo (`pip install -e ../../`); pinned by
    # name here so a fresh checkout resolves it. See platform/README.md.
    "dkmv",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.1",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.11",
    # The security-baseline suite parses docker-compose.yml to assert the
    # brokered-socket guard (AC-0.5-5); PyYAML is the parser.
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The engine lives in the sibling repo root and is editable-installed there.
[tool.uv.sources]
dkmv = { path = "../../", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires Docker + the dkmv-sandbox image",
    "security: security-baseline tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# The DKMV engine is the locked, in-process dependency (INV-13). It ships no
# py.typed marker, so mypy cannot resolve its stubs; ignore missing imports for
# it specifically (we consume it; we do not type-check it here).
[[tool.mypy.overrides]]
module = ["dkmv.*"]
ignore_missing_imports = true
