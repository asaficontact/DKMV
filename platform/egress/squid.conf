# DKMV Platform — egress allowlist proxy (G1 / INV-3 / NFR-SEC-1).
#
# Deny-all-by-default forward proxy. Sandbox containers (engine-launched) sit on
# the `dkmv-egress` internal Docker network, which has NO internet route; this
# proxy is the ONLY host able to reach the internet, and it permits HTTPS CONNECT
# tunnels ONLY to the allowlisted destination domains below. Everything else is
# denied. Because the network (not these env vars) is the enforcement, an injected
# agent cannot bypass the allowlist even by ignoring HTTP(S)_PROXY.
#
# Keep the dstdomain list in sync with the platform `EGRESS_ALLOWLIST` setting
# (api.github.com, github.com, api.anthropic.com, api.openai.com) and with the
# wider service domains GitHub/model APIs actually use at runtime.
#
# Operator validation (live, Docker+gVisor host only): see platform/docs/egress.md.

# ── Listening port ───────────────────────────────────────────────────────────
http_port 3128

# ── Source ACL: only the internal sandbox network may use the proxy ──────────
# RFC1918 ranges cover the Docker-assigned `dkmv-egress` subnet. The network's
# `internal: true` already prevents any off-host source from reaching this port.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# ── Destination allowlist (the ONLY hosts a sandbox may reach) ───────────────
# Leading-dot dstdomain matches the host AND its subdomains (e.g. `.github.com`
# matches `api.github.com`, `codeload.github.com`, `objects.githubusercontent.com`
# via `.githubusercontent.com`).
acl allowed_dst dstdomain .github.com
acl allowed_dst dstdomain .githubusercontent.com
acl allowed_dst dstdomain api.anthropic.com
acl allowed_dst dstdomain api.openai.com

# ── Ports: HTTPS only, via CONNECT ───────────────────────────────────────────
acl SSL_ports port 443
acl CONNECT method CONNECT

# Deny CONNECT to anything other than the secure (443) port.
http_access deny CONNECT !SSL_ports

# ── The allowlist gate (deny-all-by-default) ─────────────────────────────────
# Permit only allowlisted destinations from the internal network; deny the rest.
http_access allow localnet allowed_dst
http_access deny all

# ── Hardening / hygiene ──────────────────────────────────────────────────────
# Do not leak the proxy/client identity to upstreams or reveal internal topology.
forwarded_for delete
via off
httpd_suppress_version_string on

# Tunnel HTTPS opaquely (no bumping); we are an allowlist gate, not a MITM.
# Minimal, non-caching footprint.
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
